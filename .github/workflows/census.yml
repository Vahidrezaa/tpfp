name: census
on: [workflow_dispatch]
jobs:
  census:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW32
          install: mingw-w64-i686-gcc findutils
      - run: bash scripts/census.sh
      - uses: actions/upload-artifact@v4
        with:
          name: census
          path: census/
